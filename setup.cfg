# Code style of the generators and scripts: ROS 2's ament_flake8 settings, and mypy for the
# type hints. Run from the repository's root:
#   flake8 generators scripts
#   mypy generators scripts

[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
application-import-names = generators
max-line-length = 99
show-source = true
statistics = true
exclude = .cache,.git,build,install,log,node_modules

[mypy]
python_version = 3.8
ignore_missing_imports = True
exclude = (^|/)(build|install|log|node_modules)/
